# Combined MRP (SDAR) training + opencompass eval environment.
# Builds two conda envs in one image:
#   - llamafactory_sdar (py3.11, torch 2.8.0+cu128) for training
#   - opencompass       (py3.10, torch 2.7.1+cu128) for eval
# SSH login auto-activates llamafactory_sdar; switch with `conda activate opencompass`.

app_name: mrp-ssh
job_name: mrp
base_image: nvidia/cuda:12.4.1-cudnn-devel-ubuntu22.04
add_python: "3.11"

gpu:
  type: H100
  count: 8

apt_packages: [openssh-server, git, git-lfs, wget, curl, tmux, vim, rsync, build-essential]

# Required for the private SSH-style clone below.
github_ssh_key: ~/.ssh/id_ed25519_github
git_repo:
  url: git@github.com:heavyball-research/mrp-dev.git
  branch: dev/yufeng

# Append local ~/.bashrc onto the container's /root/.bashrc.
bashrc: ~/.bashrc

# Bake the local Modal credentials into the image so the VM can run `modal`
# CLI itself (needed for eval flows). WARNING: any artifact derived from this
# image effectively holds your Modal token.
local_files:
  ~/.modal.toml: /root/.modal.toml

# Persisted volumes for both train and eval flows.
#  - HF cache: shared, read-mostly
#  - mrp-train-checkpoints: training checkpoints
#  - mrp-train-tokenized-cache: HF-datasets tokenization cache (first run
#    populates ~19M examples; later runs skip dataset.map entirely)
#  - SDAR-MTD: eval checkpoints
#  - mrp-eval-outputs / mrp-eval-logs: opencompass work_dir + nohup-queue logs
volumes:
  /root/.cache/huggingface: huggingface-cache
  /root/mrp-dev/checkpoints: mrp-train-checkpoints
  /root/mrp-dev/src/training/sdar/llama_factory_sdar/tokenized_cache: mrp-train-tokenized-cache
  /root/checkpoints: SDAR-MTD
  /root/mrp-dev/outputs: mrp-eval-outputs
  /root/mrp-dev/logs: mrp-eval-logs

# Runs AFTER git_repo is cloned. Each item is its own shell, so use
# absolute pip/conda paths instead of `conda activate`.
run_commands:
  # git-lfs: register smudge/clean filters, then pull any LFS blobs in the clone.
  - git lfs install && cd /root/mrp-dev && git lfs pull
  # Miniconda
  - wget -q https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -O /tmp/miniconda.sh
  - bash /tmp/miniconda.sh -b && rm /tmp/miniconda.sh
  - /root/miniconda3/bin/conda init bash
  - /root/miniconda3/bin/conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main
  - /root/miniconda3/bin/conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/r

  # --- Training env: llamafactory_sdar (py3.11) ---
  - /root/miniconda3/bin/conda create -n llamafactory_sdar python=3.11 -y
  - /root/miniconda3/envs/llamafactory_sdar/bin/pip install torch==2.8.0+cu128 torchvision==0.23.0+cu128 torchaudio==2.8.0+cu128 --index-url https://download.pytorch.org/whl/cu128
  - cd /root/mrp-dev/src/training/sdar && /root/miniconda3/envs/llamafactory_sdar/bin/pip install -r requirements.txt
  - /root/miniconda3/envs/llamafactory_sdar/bin/pip install psutil packaging ninja wheel setuptools
  - /root/miniconda3/envs/llamafactory_sdar/bin/pip install flash-attn==2.8.3 --no-build-isolation
  # In-tree llamafactory package (editable) — launcher.py imports `llamafactory.*`
  - cd /root/mrp-dev/src/training/sdar/llama_factory_sdar && /root/miniconda3/envs/llamafactory_sdar/bin/pip install -e .

  # --- Eval env: opencompass (py3.10) ---
  - /root/miniconda3/bin/conda create -n opencompass python=3.10 -y
  - /root/miniconda3/envs/opencompass/bin/pip install torch==2.7.1+cu128 torchvision==0.22.1+cu128 torchaudio==2.7.1+cu128 --index-url https://download.pytorch.org/whl/cu128
  - /root/miniconda3/envs/opencompass/bin/pip install psutil packaging ninja wheel setuptools
  - /root/miniconda3/envs/opencompass/bin/pip install flash-attn==2.8.3 --no-build-isolation
  # vllm pinned to 0.10.2 with --no-deps so it doesn't drag in transformers>=4.55.2
  # (the requirements file pins an older transformers). Install BEFORE requirements.txt
  # so pip sees vllm==0.10.2 as already satisfied and skips re-resolving its deps.
  - /root/miniconda3/envs/opencompass/bin/pip install --no-deps vllm==0.10.2
  - cd /root/mrp-dev && /root/miniconda3/envs/opencompass/bin/pip install -r src/eval/requirements.txt
  - cd /root/mrp-dev/src/eval/opencompass && /root/miniconda3/envs/opencompass/bin/pip install -e .

  # Git identity
  - git config --global user.email "yx3038@nyu.edu"
  - git config --global user.name "Yufeng Xu"
  # Claude Code CLI
  - curl -fsSL https://claude.ai/install.sh | bash
  # Node.js + Codex CLI
  - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  - apt-get install -y nodejs
  - npm install -g npm@11.14.1
  - npm install -g @openai/codex
  # nohup-queue helper — install into both envs so train and eval flows can use it.
  - cd /root && git clone https://github.com/Zephyr271828/nohup-queue.git
  - /root/miniconda3/envs/llamafactory_sdar/bin/pip install -e /root/nohup-queue
  - /root/miniconda3/envs/opencompass/bin/pip install -e /root/nohup-queue
  # Auto-activate llamafactory_sdar on SSH login (use `conda activate opencompass` to switch).
  - echo 'source /root/miniconda3/etc/profile.d/conda.sh' >> /root/.bashrc
  - echo 'conda activate llamafactory_sdar' >> /root/.bashrc
  - echo 'source /root/.bashrc' >> /root/.profile
