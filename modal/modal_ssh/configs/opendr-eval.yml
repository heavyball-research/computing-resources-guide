# OpenDR-eval evaluation environment.

app_name: opendr-eval
job_name: opendr-eval
base_image: nvidia/cuda:12.4.1-cudnn-devel-ubuntu22.04
add_python: "3.11"

gpu:
  type: H100
  count: 1

apt_packages: [openssh-server, git, git-lfs, wget, curl, tmux, vim, rsync, build-essential]

# Required for the private SSH-style clone below.
github_ssh_key: ~/.ssh/id_ed25519_github
git_repo: 
  url: git@github.com:yulinchen99/OpenDR-eval.git
  branch: dev/yufeng
  # Clone dest defaults to /root/OpenDR-eval.

# Append local ~/.bashrc onto the container's /root/.bashrc.
bashrc: ~/.bashrc

# HF cache + persisted predownloaded benchmark cache + eval results.
volumes:
  /root/.cache/huggingface: huggingface-cache
  /root/OpenDR-eval/cache: opendr-eval-cache
  /root/OpenDR-eval/results: opendr-eval-results
  # data/ shares the same volume as datasets/ in dr-verl.yml.
  /root/OpenDR-eval/data: dr-verl-datasets
  # checkpoints/ is an independent volume.
  /root/OpenDR-eval/checkpoints: opendr-eval-checkpoints

run_commands:
  # git-lfs: register smudge/clean filters, then pull any LFS blobs in the clone.
  - git lfs install && cd /root/OpenDR-eval && git lfs pull
  # Miniconda
  - wget -q https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -O /tmp/miniconda.sh
  - bash /tmp/miniconda.sh -b && rm /tmp/miniconda.sh
  - /root/miniconda3/bin/conda init bash
  - /root/miniconda3/bin/conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main
  - /root/miniconda3/bin/conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/r
  # Env
  - /root/miniconda3/bin/conda create -n opendr python=3.11 -y
  # Repo deps (pure Python — torch/flash-attn intentionally omitted; install
  # manually inside the VM if you need deploy/search_server.py).
  - cd /root/OpenDR-eval && /root/miniconda3/envs/opendr/bin/pip install -r requirements.txt
  # SFT training deps (cu130 wheels; CUDA_HOME/PATH set inline for source builds).
  - cd /root/OpenDR-eval/sft && export CUDA_HOME="${CUDA_HOME:-/usr/local/cuda}" && export PATH="$CUDA_HOME/bin:$PATH" && /root/miniconda3/envs/opendr/bin/python -m pip install --extra-index-url https://download.pytorch.org/whl/cu130 -r requirements.txt
  # flash-attn (prebuilt cp311 wheel — avoids the long source build).
  - /root/miniconda3/envs/opendr/bin/python -m pip install "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.17/flash_attn-2.8.3+cu130torch2.12-cp311-cp311-linux_x86_64.whl"
  # nohup-queue helper
  - cd /root && git clone https://github.com/Zephyr271828/nohup-queue.git && /root/miniconda3/envs/opendr/bin/pip install -e /root/nohup-queue
  # --- vLLM serving env -------------------------------------------------------
  # Separate env so vLLM's bundled torch does NOT clobber the SFT cu130 torch +
  # flash-attn installed in `opendr` above. Serve models for eval from this env:
  #   /root/miniconda3/envs/vllm/bin/python -m vllm.entrypoints.openai.api_server \
  #     --model <path> --data-parallel-size 2 --tool-call-parser qwen3_coder \
  #     --reasoning-parser qwen3 --enforce-eager ...
  # Note: hybrid-attention models (Qwen3.5 / Qwen3-Next GDN) JIT-compile their
  # FlashInfer kernels on first serve (~8 min cold; cached to ~/.cache/flashinfer
  # afterwards) — that cache is ephemeral, so the first serve on a fresh box is slow.
  - /root/miniconda3/bin/conda create -n vllm python=3.11 -y
  - /root/miniconda3/envs/vllm/bin/pip install -U vllm
  # Eval deps too, so run_eval.py can serve + grade from this one env.
  - cd /root/OpenDR-eval && /root/miniconda3/envs/vllm/bin/pip install -r requirements.txt
  # vLLM 0.23's prometheus metrics middleware crashes on starlette 1.x
  # (AttributeError: '_IncludedRouter' object has no attribute 'path' -> HTTP 500
  # on every request, incl. /health). Pin fastapi/starlette to the 0.x line LAST,
  # after the installs above, so nothing re-upgrades them.
  - /root/miniconda3/envs/vllm/bin/pip install "fastapi<0.116" "starlette<0.42"
  # Git identity
  - git config --global user.email "yx3038@nyu.edu"
  - git config --global user.name "Yufeng Xu"
  # Claude Code CLI
  - curl -fsSL https://claude.ai/install.sh | bash
  # Node.js + Codex CLI
  - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  - apt-get install -y nodejs
  - npm install -g npm@11.14.1
  - npm install -g @openai/codex
  # Auto-activate the env on SSH login
  - echo 'source /root/miniconda3/etc/profile.d/conda.sh' >> /root/.bashrc
  - echo 'conda activate opendr' >> /root/.bashrc
  - echo 'source /root/.bashrc' >> /root/.profile
