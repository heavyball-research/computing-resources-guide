[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-sync"
version = "0.1.0"
description = "Local-edit / remote-run sync tool for use with Claude Code"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "zephyr" }]
dependencies = [
    "typer>=0.12",
    "watchdog>=4.0",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
ccsync = "ccsync.cli:app"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ccsync = ["templates/*"]
